[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-publisher"
version = "0.2.1"
description = "Queue LinkedIn posts as Markdown files and publish them through the official API. A person presses the button."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Vincent van Deth"}]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

[project.scripts]
linkedin-publisher = "linkedin_publisher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
